name: Bug report
description: Report reproducible TunnelForge behavior
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: TunnelForge version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: Ubuntu 24.04 amd64
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver
      placeholder: wstunnel
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: H0-H5 output and sanitized logs
    validations:
      required: true

name: Bug report
description: Report reproducible TunnelForge behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TunnelForge. Remove credentials and private IP information before posting logs.
  - type: input
    id: version
    attributes:
      label: TunnelForge version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / version
      placeholder: Ubuntu 24.04 amd64
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: Driver
      options: [haproxy, rinetd, socat, gost, wstunnel, gre, other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

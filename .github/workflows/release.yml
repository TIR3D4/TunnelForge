name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=TunnelForge-${GITHUB_REF_NAME}/ -o dist/TunnelForge-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TunnelForge-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

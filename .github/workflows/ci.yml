name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Test
        run: bash tests/run.sh
